name: WinGet Submission

# Manual dispatch taking the published version (unlike the NuGet workflow,
# which reads the version from the csproj): the submitted manifest must name
# the already-published gallery release explicitly.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published WCount version to submit, for example 1.0.0'
        required: true
        type: string

# The job attaches the framework-dependent artifact to the release that hosts
# it (contents: write) and opens the winget-pkgs pull request with komac.
permissions:
  contents: write

jobs:
  winget-submit:
    name: Submit ${{ inputs.version }} to winget-pkgs
    runs-on: windows-latest

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # One shared framework-dependent build configuration (T015): the csproj
      # supplies ReadyToRun, LatestMinor roll-forward, and the trim analyzer.
      # The framework stays external, so the .NET runtime dependency declared
      # below is what winget installs on runtime-less machines.
      - name: Publish the framework-dependent artifact
        run: dotnet publish src/WCountCli/WCountCli.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Package the artifact
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "wcount-$env:VERSION-windows-x64.zip" -Force

      - name: Hash the artifact
        id: hash
        shell: pwsh
        run: |
          $sha = (Get-FileHash "wcount-$env:VERSION-windows-x64.zip" -Algorithm SHA256).Hash
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      # The winget manifest points at this release asset, so the artifact needs
      # a stable public URL: create the release for the version if it is not
      # there yet and (re)attach the zip.
      - name: Attach the artifact to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $asset = "wcount-$env:VERSION-windows-x64.zip"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "WCount $env:VERSION" --notes "WCount $env:VERSION"
          }
          gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber

      # The three winget manifests are written from this template. The
      # installer manifest declares the .NET runtime as a dependency so winget
      # installs it automatically for the framework-dependent artifact (T015).
      # The winget package identifier is dotted (Publisher.App) because winget
      # requires at least two parts — it is independent of the NuGet package id.
      - name: Write the WinGet manifests
        shell: pwsh
        run: |
          $id = 'AlastairLundy.WCount'
          $version = $env:VERSION
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/wcount-$version-windows-x64.zip"
          $sha = '${{ steps.hash.outputs.sha256 }}'
          $manifestVersion = '1.12.0'
          $dir = "manifests/$id/$version"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $installer = @(
            '# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json'
            ''
            "PackageIdentifier: $id"
            "PackageVersion: $version"
            'InstallerType: zip'
            'NestedInstallerType: portable'
            'NestedInstallerFiles:'
            '  - RelativeFilePath: wcount.exe'
            '    PortableCommandAlias: wcount'
            'Dependencies:'
            '  PackageDependencies:'
            '    - PackageIdentifier: Microsoft.DotNet.Runtime.10_0'
            'UpgradeBehavior: install'
            'Installers:'
            '  - Architecture: x64'
            "    InstallerUrl: $url"
            "    InstallerSha256: $sha"
            'ManifestType: installer'
            "ManifestVersion: $manifestVersion"
          )
          $locale = @(
            '# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json'
            ''
            "PackageIdentifier: $id"
            "PackageVersion: $version"
            'PackageLocale: en-US'
            'Publisher: Alastair Lundy'
            'PublisherUrl: https://github.com/alastairlundy'
            'PublisherSupportUrl: https://github.com/alastairlundy/WCount/issues'
            'PackageName: WCount'
            'PackageUrl: https://github.com/alastairlundy/WCount'
            'License: MPL-2.0'
            'LicenseUrl: https://github.com/alastairlundy/WCount/blob/main/LICENSE.txt'
            'ShortDescription: A cross-platform word counting program and wc alternative.'
            'Moniker: wcount'
            'ManifestType: defaultLocale'
            "ManifestVersion: $manifestVersion"
          )
          $versionManifest = @(
            '# yaml-language-server: $schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json'
            ''
            "PackageIdentifier: $id"
            "PackageVersion: $version"
            'DefaultLocale: en-US'
            'ManifestType: version'
            "ManifestVersion: $manifestVersion"
          )

          $installer | Set-Content -Path "$dir/$id.installer.yaml"
          $locale | Set-Content -Path "$dir/$id.locale.en-US.yaml"
          $versionManifest | Set-Content -Path "$dir/$id.yaml"

      # Prerequisites for komac: the WINGET_TOKEN secret must be a classic
      # personal access token with the public_repo scope (fine-grained tokens
      # cannot open pull requests against microsoft/winget-pkgs), and the token's
      # account must already own a fork of microsoft/winget-pkgs. komac submit
      # opens the pull request for a new package or adds the version to an
      # existing one.
      #
      # Manifest-shape failures (winget-pkgs validation rejecting a field, the
      # dependency block, or the artifact) are retried by re-dispatching this
      # workflow for the same version: fix the manifest template above, close
      # any failed pull request and delete its branch if one is still open, then
      # dispatch again. --skip-duplicate on the NuGet side and --clobber on the
      # release upload keep a re-dispatch idempotent.
      - name: Open or update the winget-pkgs pull request with komac
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          gh release download --repo russellbanks/Komac --pattern 'komac-[0-9]*-x86_64-pc-windows-msvc.exe' --dir komac
          $exe = (Get-ChildItem komac -Filter '*.exe' | Select-Object -First 1).FullName
          & $exe submit manifests --yes --token $env:GITHUB_TOKEN
