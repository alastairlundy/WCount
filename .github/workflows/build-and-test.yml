name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms matter: the CLI baselines cover byte, character and line
        # counts, so a fixture whose line endings differ between checkouts would
        # only fail on one of them.
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/WCount.slnx

      - name: Build
        run: dotnet build src/WCount.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/WCount.slnx -c Release --no-build --verbosity normal
